name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Refresh known dependency advisories and workflow security weekly.
    - cron: '17 7 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      format: ${{ steps.paths.outputs.format }}
      source: ${{ steps.paths.outputs.source }}
      agents: ${{ steps.paths.outputs.agents }}
      dependencies: ${{ steps.paths.outputs.dependencies }}
      workflows: ${{ steps.paths.outputs.workflows }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Detect modified files
        if: github.event_name != 'schedule'
        id: paths
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        with:
          filters: |
            format:
              - '**/*.ts'
              - '**/*.tsx'
              - '**/*.js'
              - '**/*.mjs'
              - '**/*.cjs'
              - '**/*.json'
              - '**/*.md'
              - '**/*.yml'
              - '**/*.yaml'
            source:
              - 'src/**'
              - 'tools/oxlint/anti-slop/**'
              - 'vite.config.ts'
              - 'tsconfig.json'
              - 'package.json'
              - 'package-lock.json'
              - '.npmrc'
              - '.nvmrc'
            agents:
              - 'AGENTS.md'
              - 'src/**'
              - 'package.json'
              - 'package-lock.json'
              - 'vite.config.ts'
              - '.npmrc'
              - '.nvmrc'
            dependencies:
              - 'package.json'
              - 'package-lock.json'
              - '.npmrc'
              - '.nvmrc'
            workflows:
              - '.github/workflows/**'
              - '.github/actions/**'
              - '.github/dependabot.yml'

  quality:
    name: Vite+, anti-slop, AGENTS.md and tests
    needs: changes
    if: ${{ needs.changes.outputs.format == 'true' || needs.changes.outputs.source == 'true' || needs.changes.outputs.agents == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install pinned npm
        run: npm install --global npm@11.16.0 --ignore-scripts
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Formatting (Oxfmt)
        if: needs.changes.outputs.format == 'true'
        run: npm exec -- vp fmt --check
      - name: Lint and type-check (Oxlint + anti-slop)
        if: needs.changes.outputs.source == 'true'
        run: npm run lint
      - name: Agent instructions (agents-md-lint)
        if: needs.changes.outputs.agents == 'true'
        run: npm run lint:agents
      - name: Tests and coverage (Vitest)
        if: needs.changes.outputs.source == 'true'
        run: npm run test:coverage
      - name: Build (Vite+)
        if: needs.changes.outputs.source == 'true'
        run: npm run build

  audit:
    name: npm advisory report
    needs: changes
    if: ${{ github.event_name == 'schedule' || needs.changes.outputs.dependencies == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install pinned npm
        run: npm install --global npm@11.16.0 --ignore-scripts
      - name: Report known vulnerabilities (baseline non-blocking)
        id: npm_audit
        continue-on-error: true
        run: npm run audit
      - name: Flag existing vulnerabilities
        if: steps.npm_audit.outcome == 'failure'
        run: echo "::warning::npm audit found advisories. Review the report; Dependency Review blocks new high-severity vulnerabilities on PRs."

  dependency_review:
    name: New dependency vulnerability review
    needs: changes
    if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.dependencies == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  workflow_security:
    name: actionlint and zizmor
    needs: changes
    if: ${{ github.event_name == 'schedule' || needs.changes.outputs.workflows == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate GitHub workflows (actionlint)
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.11 -color
      - name: Scan workflows (zizmor)
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: v1.32.0
          advanced-security: false
          min-severity: medium
          min-confidence: medium

  ci_result:
    name: CI result
    if: ${{ always() }}
    needs: [changes, quality, audit, dependency_review, workflow_security]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful applicable checks
        env:
          CHANGE_RESULT: ${{ needs.changes.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          AUDIT_RESULT: ${{ needs.audit.result }}
          DEPENDENCY_RESULT: ${{ needs.dependency_review.result }}
          WORKFLOW_RESULT: ${{ needs.workflow_security.result }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$CHANGE_RESULT" != 'success' ]]; then
            echo "::error::File-change detection failed: $CHANGE_RESULT"
            exit 1
          fi
          for result in "$QUALITY_RESULT" "$AUDIT_RESULT" "$DEPENDENCY_RESULT" "$WORKFLOW_RESULT"; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::CI gate finished with $result"; exit 1 ;;
            esac
          done
          echo 'All applicable CI checks passed.'
